<div class="login-container">

  <mat-card class="login-card">

    <h2>Connexion</h2>

    <mat-form-field appearance="outline" class="full">
      <input matInput placeholder="Email" [(ngModel)]="email">
    </mat-form-field>

    <mat-form-field appearance="outline" class="full">
      <input matInput type="password" placeholder="Mot de passe" [(ngModel)]="password">
    </mat-form-field>

    <button mat-raised-button color="primary" class="full" (click)="login()">
      Se connecter
    </button>

    <p class="register">
      Pas de compte ?
      <a routerLink="/register">Créer un compte</a>
    </p>

  </mat-card>

</div>
