<div class="register-container">
  <mat-card class="register-card">

    <h2>Créer un compte</h2>

    <mat-form-field appearance="outline" class="full">
      <mat-label>Nom</mat-label>
      <input matInput [(ngModel)]="nom" name="nom">
    </mat-form-field>

    <mat-form-field appearance="outline" class="full">
      <mat-label>Prénom</mat-label>
      <input matInput [(ngModel)]="prenom" name="prenom">
    </mat-form-field>

    <mat-form-field appearance="outline" class="full">
      <mat-label>Email</mat-label>
      <input matInput [(ngModel)]="email" name="email">
    </mat-form-field>

    <mat-form-field appearance="outline" class="full">
      <mat-label>Mot de passe</mat-label>
      <input matInput type="password" [(ngModel)]="password" name="password">
    </mat-form-field>

    <button mat-raised-button color="primary" class="full" (click)="register()">
      Créer un compte
    </button>

    <p class="login-link">
      Déjà un compte ?
      <a routerLink="/login">Se connecter</a>
    </p>

  </mat-card>
</div>
