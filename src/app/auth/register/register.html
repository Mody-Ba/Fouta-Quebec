<div class="register-container">

  <mat-card class="register-card">

    <h2>Créer un compte</h2>

    <mat-form-field appearance="outline" class="full">
      <input matInput placeholder="Nom" [(ngModel)]="nom">
    </mat-form-field>

    <mat-form-field appearance="outline" class="full">
      <input matInput placeholder="Prénom" [(ngModel)]="prenom">
    </mat-form-field>

    <mat-form-field appearance="outline" class="full">
      <input matInput placeholder="Email" [(ngModel)]="email">
    </mat-form-field>

    <mat-form-field appearance="outline" class="full">
      <input matInput type="password" placeholder="Mot de passe" [(ngModel)]="password">
    </mat-form-field>

    <button mat-raised-button color="primary" class="full" (click)="register()">
      Créer un compte
    </button>

    <p class="login-link">
      Déjà un compte ?
      <a routerLink="/login">Se connecter</a>
    </p>

  </mat-card>

</div>
